[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rakshya"
version = "1.1"
description = "Find personal information in Nepali, romanised Nepali and English text: rules and a small tagger, no PyTorch needed."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy", "onnxruntime", "tokenizers", "huggingface_hub"]
keywords = ["nepali", "pii", "privacy", "redaction", "named-entity-recognition"]

[project.urls]
Homepage = "https://github.com/fiste-ai/rakshya"
Model = "https://huggingface.co/fiste-ai/rakshya"

[project.scripts]
rakshya = "rakshya.cli:main"

[tool.setuptools]
packages = ["rakshya"]
