[package]
name = "gopya"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Nepali PII detection for the browser: rules, tokenizer and span decoding"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.23.2", default-features = false, features = ["unstable_wasm"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

# The command line build: optimised, but quick to compile.
[profile.cli]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = false
